name: C++ CMake Qt Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # CRITICAL: This tells GitHub to use your 12700K desktop
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Environment Variables
      run: |
        # Point to your MinGW and Qt paths
        echo "C:\Qt\Tools\mingw1120_64\bin" >> $GITHUB_PATH
        echo "C:\Qt\6.10.2\mingw_64\bin" >> $GITHUB_PATH
        echo "CMAKE_PREFIX_PATH=C:\Qt\6.10.2\mingw_64" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        # Use Ninja for faster builds
        cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: |
        cmake --build build

    - name: Run Tests (Optional)
      run: |
        cd build
        ctest -C Release --output-on-failure
